name: CI - Quality Gate

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  build-and-test:
    name: Build, Test & Quality Gate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for better analysis

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build with Maven
      run: mvn clean compile

    - name: Run Unit Tests
      run: mvn test

    - name: Run Integration Tests
      run: mvn verify -DskipUnitTests

    - name: Generate JaCoCo Coverage Report
      run: mvn jacoco:report

    - name: Verify Code Coverage (Quality Gate)
      run: mvn jacoco:check
      continue-on-error: false

    - name: SonarCloud Scan
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      working-directory: ./HW1
      run: mvn sonar:sonar -Dsonar.projectBaseDir=${GITHUB_WORKSPACE}/HW1

    - name: Upload Coverage Reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: coverage-reports
        path: |
          target/site/jacoco/
          target/surefire-reports/
          target/failsafe-reports/

    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: |
          target/surefire-reports/*.xml
          target/failsafe-reports/*.xml

    - name: Comment Coverage on PR
      if: github.event_name == 'pull_request'
      uses: madrapps/jacoco-report@v1.6.1
      with:
        paths: target/site/jacoco/jacoco.xml
        token: ${{ secrets.GITHUB_TOKEN }}
        min-coverage-overall: 40
        min-coverage-changed-files: 40
        title: 'Code Coverage Report'
        update-comment: true

  quality-gate-summary:
    name: Quality Gate Summary
    runs-on: ubuntu-latest
    needs: build-and-test
    if: always()

    steps:
    - name: Check Quality Gate Status
      run: |
        if [ "${{ needs.build-and-test.result }}" != "success" ]; then
          echo "❌ Quality Gate FAILED"
          echo "The build, tests, or coverage requirements did not meet the minimum standards."
          exit 1
        else
          echo "✅ Quality Gate PASSED"
          echo "All tests passed and coverage meets the 80% threshold."
        fi
