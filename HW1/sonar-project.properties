# SonarQube Configuration
# Required metadata
sonar.projectKey=zeromones-waste-collection
sonar.projectName=ZeroMonos Waste Collection System
sonar.projectVersion=1.0.0

# Organization (for SonarCloud)
# Replace 'your-org' with your actual SonarCloud organization key
sonar.organization=your-org

# SonarCloud host URL
sonar.host.url=https://sonarcloud.io

# Source and test directories
sonar.sources=src/main/java
sonar.tests=src/test/java

# Encoding
sonar.sourceEncoding=UTF-8

# Java version
sonar.java.source=17
sonar.java.target=17

# Code coverage
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Exclude files from analysis
sonar.exclusions=**/dto/**,**/model/**,**/config/**,**/exception/**
sonar.test.exclusions=src/test/**

# Additional properties
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
