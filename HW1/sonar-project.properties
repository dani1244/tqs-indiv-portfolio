# SonarCloud Configuration for HW1 Only
sonar.organization=dani1244
sonar.projectKey=dani1243_zeromonos
sonar.projectName=ZeroMonos

# Project base directory (HW1 folder only)
sonar.projectBaseDir=.

# Paths (relative to HW1 folder)
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Coverage
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Exclusions (exclude DTOs, models, config, exceptions from analysis)
sonar.exclusions=**/dto/**,**/model/**,**/config/**,**/exception/**
sonar.test.exclusions=**/test/**

# Language
sonar.language=java
sonar.java.source=17

# Disable SCM (Git) provider if running from subfolder
sonar.scm.disabled=true
