# Selenium-Jupiter Configuration
# Colocar este ficheiro em: src/test/resources/selenium-jupiter.properties

# Chrome options para resolver o problema do user-data-dir
sel.jup.chrome.args=--headless=new,--no-sandbox,--disable-dev-shm-usage,--disable-gpu,--window-size=1920x1080,--remote-debugging-port=0

# Timeout padrão
sel.jup.timeout=30

# Screenshot on failure
sel.jup.screenshot.at.the.end.of.tests=true
sel.jup.output.folder=target/selenium-jupiter

# Browser em modo headless
sel.jup.browser.headless=true